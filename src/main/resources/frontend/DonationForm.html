
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publish Donation | FoodBridge</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- Navigation -->
<nav>
    <a class="brand" th:href="@{/}">FoodBridge</a>

    <div>
        <a th:href="@{/donations}">Donation Listings</a>
        <a th:href="@{/donor/staff-accounts}">Donor Staff</a>
    </div>
</nav>

<main class="narrow">

    <!-- Page Heading -->
    <p class="eyebrow">DONATION TRACK</p>

    <h1>Publish Surplus Food</h1>

    <p class="muted">
        Provide clear quantity, collection timing, and dietary/allergen
        information. Donations are free.
    </p>

    <!-- Safety Cutoff Error -->
    <p class="notice"
       th:if="${cutoffError != null}"
       th:text="${cutoffError}">
    </p>

    <!-- Donation Form -->
    <form
            class="panel profile-form"
            th:action="@{/donor/donations}"
            th:object="${form}"
            method="post">

        <!-- Food Name -->
        <label for="foodName">Food Name</label>

        <input
                type="text"
                id="foodName"
                th:field="*{foodName}"
                maxlength="160"
                required>

        <p class="notice"
           th:if="${#fields.hasErrors('foodName')}"
           th:errors="*{foodName}">
        </p>

        <!-- Description -->
        <label for="description">Description</label>

        <textarea
                id="description"
                th:field="*{description}"
                maxlength="2000"
                rows="3"
                required>
            </textarea>

        <p class="notice"
           th:if="${#fields.hasErrors('description')}"
           th:errors="*{description}">
        </p>

        <!-- Donor Organization -->
        <label for="donorOrganization">Donor Organization</label>

        <input
                type="text"
                id="donorOrganization"
                th:field="*{donorOrganization}"
                maxlength="120"
                required>

        <p class="notice"
           th:if="${#fields.hasErrors('donorOrganization')}"
           th:errors="*{donorOrganization}">
        </p>

        <!-- Pickup Address -->
        <label for="pickupAddress">Pickup Address</label>

        <input
                type="text"
                id="pickupAddress"
                th:field="*{pickupAddress}"
                maxlength="300"
                required>

        <p class="notice"
           th:if="${#fields.hasErrors('pickupAddress')}"
           th:errors="*{pickupAddress}">
        </p>

        <!-- Quantity -->
        <label for="quantity">Quantity (Portions / Units)</label>

        <input
                type="number"
                id="quantity"
                th:field="*{quantity}"
                min="1"
                max="100000"
                required>

        <p class="notice"
           th:if="${#fields.hasErrors('quantity')}"
           th:errors="*{quantity}">
        </p>

        <!-- Pickup Start -->
        <label for="pickupStart">Pickup Starts</label>

        <input
                type="datetime-local"
                id="pickupStart"
                th:field="*{pickupStart}"
                required>

        <p class="notice"
           th:if="${#fields.hasErrors('pickupStart')}"
           th:errors="*{pickupStart}">
        </p>

        <!-- Safety Cutoff -->
        <label for="safetyCutoff">Safety Cutoff</label>

        <input
                type="datetime-local"
                id="safetyCutoff"
                th:field="*{safetyCutoff}"
                required>

        <p class="notice"
           th:if="${#fields.hasErrors('safetyCutoff')}"
           th:errors="*{safetyCutoff}">
        </p>

        <!-- Dietary Tags -->
        <fieldset>
            <legend>Dietary and Allergen Tags</legend>

            <div th:each="tag : ${tags}">
                <label>
                    <input
                            type="checkbox"
                            th:field="*{dietaryTags}"
                            th:value="${tag}">

                    <span th:text="${tag}">Dietary Tag</span>
                </label>
            </div>
        </fieldset>

        <p class="notice"
           th:if="${#fields.hasErrors('dietaryTags')}"
           th:errors="*{dietaryTags}">
        </p>

        <!-- Submit -->
        <button class="button" type="submit">
            Publish Donation
        </button>

    </form>

</main>

</body>
</html>
