<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Cash on Pickup</title>

    <link rel="stylesheet" href="/css/app.css">
</head>

<body>

<main class="wrap">

    <h1>Cash-on-Pickup</h1>

    <h2 th:text="${listing.name}"></h2>

    <p>
        Pay in cash at the store when collecting the order.
        Stock is reserved now. Bring the pickup code shown on your order.
    </p>

    <form method="post">

        <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

        <label>
            Quantity

            <input
                    type="number"
                    name="quantity"
                    value="1"
                    min="1"
                    max="20"
                    required>
        </label>

        <button type="submit">
            Reserve and pay at pickup
        </button>

    </form>

</main>

</body>
</html>
