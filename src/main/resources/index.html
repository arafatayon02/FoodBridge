<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consumer Portal</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>FoodBridge · Consumer Portal</h1><small>REST API: localhost:8080 · JWT stored in this browser tab</small></header><main><section><h2>FOOD-13 · Consumer registration / login</h2><div class="grid"><div><label>Full name</label><input id="name"><label>Email</label><input id="registerEmail"><label>Phone</label><input id="phone"><label>Password</label><input id="registerPass" type="password"><button id="register">Register consumer</button></div><div><label>Email</label><input id="email"><label>Password</label><input id="pass" type="password"><button id="login">Sign in</button></div></div><pre class="msg" id="authOut"></pre></section><section><h2>FOOD-38 · Consumer password recovery</h2><p>Use the forgot-password link once the shared password-recovery API is integrated (see README).</p><label>Email</label><input id="forgotEmail"><button id="forgot">Request code</button><label>Code</label><input id="code"><label>New password</label><input id="newPassword" type="password"><button id="reset">Reset password</button><pre class="msg" id="resetOut"></pre></section><section><h2>FOOD-40 · Consumer discount feed</h2><button id="feed">Show available discounts</button><div id="list"></div><pre class="msg" id="feedOut"></pre></section></main><script src="common.js"></script><script src="app.js"></script></body></html>
